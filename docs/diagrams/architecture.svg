<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" role="img" aria-label="AutoDL 架构图">
  <style>
    .node rect{fill:#f3f0e9;stroke:#d9d5cc;stroke-width:1.4;}
    .node.acc rect{fill:#fbe7dd;stroke:#e8612c;}
    .node.blue rect{fill:#eef3f8;stroke:#bcd2e6;}
    .node.green rect{fill:#eaf4ee;stroke:#b7d8c2;}
    .node text{font-size:13px;fill:#1c1b19;font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
    .node .t2{font-size:10.5px;fill:#6b6862;}
    .edge{fill:none;stroke:#d9d5cc;stroke-width:1.5;}
    .edge.acc{stroke:#e8612c;}
    .edge.link{stroke:#2f6fb0;stroke-dasharray:4 3;}
    .grp{fill:none;stroke:#d9d5cc;stroke-dasharray:5 4;stroke-width:1.3;}
    .grp-t{font-size:12px;fill:#6b6862;font-weight:600;font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
    text{font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9d5cc"/>
    </marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8612c"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fb0"/>
    </marker>
  </defs>
  <!-- ===== Group: Control Plane ===== -->
  <rect class="grp" x="20" y="50" width="1000" height="250" rx="10"/>
  <text class="grp-t" x="36" y="44">控制面 (Control Plane) — core/loop.py + agents.py</text>

  <g class="node acc">
    <rect x="48" y="92" width="180" height="68" rx="8"/>
    <text x="138" y="118" text-anchor="middle" font-weight="700">Leader（编排者）</text>
    <text class="t2" x="138" y="138" text-anchor="middle">读账本→写 THINK→调度 Code Agent</text>
  </g>

  <g class="node">
    <rect x="300" y="100" width="150" height="52" rx="8"/>
    <text x="375" y="124" text-anchor="middle" font-weight="600">Dispatcher</text>
    <text class="t2" x="375" y="142" text-anchor="middle">并行度/队列/PID 追踪</text>
  </g>

  <g class="node blue">
    <rect x="500" y="78" width="150" height="52" rx="8"/>
    <text x="575" y="102" text-anchor="middle" font-weight="600">Idea Agent</text>
    <text class="t2" x="575" y="120" text-anchor="middle">文献检索 / 假设</text>
  </g>
  <g class="node blue">
    <rect x="500" y="142" width="150" height="52" rx="8"/>
    <text x="575" y="166" text-anchor="middle" font-weight="600">Code Agent</text>
    <text class="t2" x="575" y="184" text-anchor="middle">改代码 / 启动实验</text>
  </g>
  <g class="node blue">
    <rect x="500" y="206" width="150" height="46" rx="8"/>
    <text x="575" y="230" text-anchor="middle" font-weight="600">Writing Agent</text>
    <text class="t2" x="575" y="246" text-anchor="middle">产出论文 / 报告</text>
  </g>

  <g class="node">
    <rect x="708" y="120" width="150" height="60" rx="8"/>
    <text x="783" y="144" text-anchor="middle" font-weight="600">ToolRegistry</text>
    <text class="t2" x="783" y="162" text-anchor="middle">每 Agent 最小工具集</text>
    <text class="t2" x="783" y="176" text-anchor="middle">受保护写边界</text>
  </g>

  <g class="node green">
    <rect x="708" y="200" width="150" height="60" rx="8"/>
    <text x="783" y="224" text-anchor="middle" font-weight="600">记忆 + 账本</text>
    <text class="t2" x="783" y="242" text-anchor="middle">PROJECT_BRIEF / MEMORY_LOG</text>
  </g>

  <!-- ===== Group: Execution Plane ===== -->
  <rect class="grp" x="20" y="330" width="1000" height="180" rx="10"/>
  <text class="grp-t" x="36" y="324">执行面 (Execution Plane) — execution.py</text>

  <g class="node">
    <rect x="48" y="372" width="170" height="56" rx="8"/>
    <text x="133" y="395" text-anchor="middle" font-weight="600">ExecutionBackend</text>
    <text class="t2" x="133" y="413" text-anchor="middle">local / ssh / slurm 三态</text>
  </g>

  <g class="node">
    <rect x="270" y="356" width="150" height="48" rx="8"/>
    <text x="345" y="380" text-anchor="middle" font-weight="600">local 后端</text>
    <text class="t2" x="345" y="396" text-anchor="middle">subprocess + nohup 日志</text>
  </g>
  <g class="node">
    <rect x="270" y="416" width="150" height="48" rx="8"/>
    <text x="345" y="440" text-anchor="middle" font-weight="600">ssh 后端</text>
    <text class="t2" x="345" y="456" text-anchor="middle">远程训练节点</text>
  </g>
  <g class="node">
    <rect x="452" y="386" width="150" height="48" rx="8"/>
    <text x="527" y="410" text-anchor="middle" font-weight="600">slurm 后端</text>
    <text class="t2" x="527" y="426" text-anchor="middle">sbatch + sacct 探针</text>
  </g>

  <g class="node acc">
    <rect x="650" y="360" width="170" height="100" rx="8"/>
    <text x="735" y="384" text-anchor="middle" font-weight="700">GPU 子系统</text>
    <text class="t2" x="735" y="404" text-anchor="middle">detect.py: nvidia-smi 探测</text>
    <text class="t2" x="735" y="420" text-anchor="middle">get_free_gpus 选卡</text>
    <text class="t2" x="735" y="436" text-anchor="middle">keeper.py: 保活/保留末卡</text>
  </g>

  <g class="node">
    <rect x="860" y="386" width="130" height="48" rx="8"/>
    <text x="925" y="410" text-anchor="middle" font-weight="600">Monitor</text>
    <text class="t2" x="925" y="426" text-anchor="middle">进度/停滞 检测</text>
  </g>

  <!-- ===== Group: Data & Governance ===== -->
  <rect class="grp" x="20" y="540" width="1000" height="180" rx="10"/>
  <text class="grp-t" x="36" y="534">数据面与治理 (Data &amp; Governance)</text>

  <g class="node">
    <rect x="48" y="582" width="200" height="72" rx="8"/>
    <text x="148" y="606" text-anchor="middle" font-weight="600">workspace/ (实验沙盒)</text>
    <text class="t2" x="148" y="624" text-anchor="middle">state.json · experiments.jsonl</text>
    <text class="t2" x="148" y="640" text-anchor="middle">candidate/ champion/ 分支</text>
  </g>

  <g class="node">
    <rect x="300" y="582" width="200" height="72" rx="8"/>
    <text x="400" y="606" text-anchor="middle" font-weight="600">ExperimentContract</text>
    <text class="t2" x="400" y="624" text-anchor="middle">预算契约 / 写保护策略</text>
    <text class="t2" x="400" y="640" text-anchor="middle">版本化 Git SHA 升级</text>
  </g>

  <g class="node green">
    <rect x="552" y="582" width="200" height="72" rx="8"/>
    <text x="652" y="606" text-anchor="middle" font-weight="600">Git 仓库</text>
    <text class="t2" x="652" y="624" text-anchor="middle">champion_before/after_sha</text>
    <text class="t2" x="652" y="640" text-anchor="middle">candidate_sha 溯源</text>
  </g>

  <g class="node blue">
    <rect x="804" y="582" width="170" height="72" rx="8"/>
    <text x="889" y="606" text-anchor="middle" font-weight="600">快照 / 知识沉淀</text>
    <text class="t2" x="889" y="624" text-anchor="middle">snapshots.py 导出</text>
    <text class="t2" x="889" y="640" text-anchor="middle">evidence/ contracts/</text>
  </g>

  <!-- ===== EDGES ===== -->
  <path class="edge acc" marker-end="url(#arrow-acc)" d="M228 126 L296 126"/>
  <path class="edge" marker-end="url(#arrow)" d="M450 126 L470 126 L470 104 L496 104"/>
  <path class="edge" marker-end="url(#arrow)" d="M450 126 L470 126 L470 168 L496 168"/>
  <path class="edge" marker-end="url(#arrow)" d="M450 126 L470 126 L470 229 L496 229"/>
  <path class="edge" marker-end="url(#arrow)" d="M450 126 L450 70 L704 70 L704 150"/>
  <path class="edge link" marker-end="url(#arrow-link)" d="M783 180 L783 196"/>

  <path class="edge" marker-end="url(#arrow)" d="M375 152 L375 260 L133 260 L133 368"/>
  <path class="edge" marker-end="url(#arrow)" d="M375 152 L375 260 L345 260 L345 352"/>
  <path class="edge" marker-end="url(#arrow)" d="M527 386 L527 370 L646 370"/>
  <path class="edge" marker-end="url(#arrow)" d="M420 380 L440 380 L440 450 L646 450"/>
  <path class="edge" marker-end="url(#arrow)" d="M420 440 L440 440 L440 450 L646 450"/>
  <path class="edge" marker-end="url(#arrow)" d="M820 410 L856 410"/>
  <path class="edge link" marker-end="url(#arrow-link)" d="M860 398 L824 398"/>

  <path class="edge" marker-end="url(#arrow)" d="M248 618 L296 618"/>
  <path class="edge link" marker-end="url(#arrow-link)" d="M248 400 L222 400"/>
  <path class="edge" marker-end="url(#arrow)" d="M500 618 L548 618"/>
  <path class="edge link" marker-end="url(#arrow-link)" d="M752 618 L800 618"/>
</svg>
