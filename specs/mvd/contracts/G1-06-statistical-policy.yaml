# =============================================================
# G1-06 Statistical Policy —— D-06 修订版
# Owner 决定：禁止 2x pooled SE，改用 paired-delta Student-t policy。
# =============================================================

# ---------------- 正式统计政策 ----------------
uncertainty_method:
  value: "PAIRED_SE_V1"
  id: "UNCERTAINTY_METHOD"

confidence_policy:
  id: "CONFIDENCE_POLICY_ID"
  value: "PAIRED_STUDENT_T_ONE_SIDED_95_V1"

pooled_se:
  allowed: false
  id: "POOLED_SE_ALLOWED"
  value: "NO"

fixed_2x_multiplier:
  allowed: false
  id: "FIXED_2X_MULTIPLIER_ALLOWED"
  value: "NO"

# ---------------- 计算定义（Owner 批准） ----------------
computation:
  pair_delta: "d_i = normalized_pair_delta(candidate_i, champion_i)"
  mean_delta: "mean_delta = mean(d_i)"
  standard_error: "SE = sample_std(d_i, ddof=1) / sqrt(n)"
  uncertainty_margin: "uncertainty_margin = t_quantile(df=n-1, one_sided_confidence=0.95) × SE"
  decision_bar: "decision_bar = max(min_practical_delta, uncertainty_margin)"
  note: >-
    candidate 与 champion 必须按相同 seed 计算差值（配对），
    不能对两组原始观测做 pooled SE。

# ---------------- 判定语义（保持 V3.0 原语义） ----------------
decision:
  improved: "mean_delta >= decision_bar      -> IMPROVED"
  regression: "mean_delta <= -decision_bar    -> REGRESSION"
  equivalent: "其他                             -> EQUIVALENT_OR_INCONCLUSIVE"

# ---------------- 不充分证据处理 ----------------
insufficient_evidence:
  trigger: >-
    任何 seed 不配对、n<3、非有限值或 SE 不可计算
  bar_resolution: "BAR_RESOLUTION=INSUFFICIENT_EVIDENCE"
  final_decision: "FINAL_DECISION=HUMAN_REVIEW"
  action: "HUMAN_REVIEW"

# ---------------- seeds & repeats（D-05 批准） ----------------
seeds:
  value: [17, 29, 43]
  status: "APPROVED_D05"
  id: "D05_SEEDS"

repeats:
  minimum_repeats: 3
  status: "APPROVED_D05"
  id: "D05_MINIMUM_REPEATS"

# ---------------- practical delta（D-07 有条件批准） ----------------
practical_delta:
  value: 0.02
  unit_registry_id: "NLL_NAT_PER_TOKEN_V1"
  id: "MIN_PRACTICAL_DELTA"
  status: "CONDITIONALLY_APPROVED_D07"
  condition: >-
    仅当 evaluator 明确使用自然对数、按有效 token 归一化的平均 NLL 时生效。
    若当前 validation_loss 是 batch mean / sample mean / 其他 reduction，
    必须重新定义单位和阈值，不得沿用 0.02 nats。
  requirement: "POSITIVE_FINITE"
  forbidden_source: "C8/C9 结果不得反推此值"

# ---------------- fallback bar（OB-3） ----------------
fallback_bar:
  value: null
  enabled: false
  id: "FALLBACK_BAR_ENABLED"
  value_flag: "NO"

# ---------------- comparison 规则 ----------------
