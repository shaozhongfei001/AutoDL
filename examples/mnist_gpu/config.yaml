# MNIST GPU experiment config — real PyTorch GPU training.
project:
  name: "mnist-gpu"
  brief: "PROJECT_BRIEF.md"
  workspace: "workspace"

agent:
  # DeepSeek official API is OpenAI-compatible: provider "openai" + base_url.
  provider: "openai"
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com"
  api_key_env: "DSEEK_2026_SZF_KEY"
  max_cycles: -1   # unlimited rounds for unattended multi-round CNN search
  max_steps_per_cycle: 8
  cooldown_interval: 30

monitor:
  # Short enough to observe the monitoring loop during a short training run.
  poll_interval: 5
  zero_llm: true
  notify_on_complete: true

gpu:
  auto_detect: true
  reserve_last: false

experiment:
  mandatory_dry_run: true
  max_parallel: 1
  log_tail_lines: 40
  # --- Experiment Validity Contract (SDD ADR-001 / STUDY-001) ---
  budget:
    mode: "active_wall_clock_seconds"
    limit: 300              # active_train_seconds budget (excludes setup/eval)
    hard_wall_clock_limit: 420  # hard cap; monitor kills runs past this
    timer: "monotonic"
    # In-run early stop (train-level): parse per-epoch validation from the live
    # log and terminate the run once it has plateaued for `patience` epochs, so
    # GPU is not wasted on epochs that cannot improve. 0/empty disables.
    early_stop:
      enabled: true
      metric: "validation_accuracy"
      patience: 2            # plateau for N consecutive epochs -> early stop
      improvement_tol: 0.001 # "no improvement" band (match ~MNIST val noise ±0.002)
      min_epochs: 3          # never stop before N epochs observed
  evaluation:
    primary_metric:
      name: "validation_accuracy"
      direction: "maximize"
      unit: "pp"
    validation_metrics: ["validation_accuracy", "validation_loss"]
    test_metrics: ["test_accuracy", "test_loss"]
    minimum_effect_size: 0.005
  comparability:
    hardware_cohort_id: "COHORT-RTX3060L-6G"
    requires_exact_cohort: true
    data_fingerprint: "MNIST-official-idx-ubyte-raw"
    evaluator_fingerprint: "FIXED-SPLIT-SEED=20260815"
  # --- Protected Write Boundary (SDD D0 / ADR-002) ---
  write_policy:
    allowlist: []   # empty => denylist-only (default); set to narrow for strict worktree
    denylist_dirs:
      - "data/"
      - ".codebuddy/"
      - "contracts/"
      - "tests/"
      - "artifacts/"
    denylist_files:
      - "config.yaml"
      - "core/monitor.py"
      - "core/ledger.py"
      - "core/experiment_contract.py"
      - "PROJECT_BRIEF.md"
      - "state.json"
      - "MEMORY_LOG.md"
  # --- Loop Engineering (SDD 05) ---
  loop_engineering:
    enabled: true          # enable machine-judgment loop (M2) + unattended promotion
    dedup:
      enabled: true        # M5: reject repeated hypotheses across rounds
      repeated_hypothesis_limit: 1
    noise_std: 0.0018      # measured baseline noise (seed std); effective bar = max(eval.min_effect_size, 2*noise_std)
    # Active loop-level early stop: detect saturation from machine verdicts and
    # leader stagnation so the unattended loop converges on its own instead of
    # cycling forever until a human kills the process.
    early_stop:
      enabled: true
      saturation_rounds: 3          # N consecutive DISCARD within noise band -> saturated
      plateau_band: 2.0             # |delta| <= plateau_band*noise_std counts as plateau
      max_consecutive_no_experiment: 3  # leader launches no experiment for N rounds -> stop
